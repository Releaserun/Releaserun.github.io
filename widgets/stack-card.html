<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Health Card — ReleaseRun</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: transparent; }
    .card { border: 1px solid #30363d; border-radius: 8px; overflow: hidden; max-width: 480px; background: #0d1117; color: #e6edf3; }
    .card-header { padding: 14px 16px; border-bottom: 1px solid #30363d; font-weight: 600; font-size: 0.95em; display: flex; align-items: center; justify-content: space-between; }
    .card-header .grade { padding: 2px 10px; border-radius: 4px; font-size: 0.85em; font-weight: 700; }
    .grade-a { background: rgba(63,185,80,0.2); color: #3fb950; }
    .grade-b { background: rgba(63,185,80,0.15); color: #56d364; }
    .grade-c { background: rgba(210,153,34,0.2); color: #d29922; }
    .grade-d { background: rgba(248,81,73,0.15); color: #f85149; }
    .grade-f { background: rgba(248,81,73,0.2); color: #f85149; }
    .card-body { padding: 8px 0; }
    .row { display: flex; align-items: center; padding: 6px 16px; gap: 10px; font-size: 0.88em; }
    .row:hover { background: rgba(255,255,255,0.03); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: #3fb950; } .dot-yellow { background: #d29922; } .dot-red { background: #f85149; } .dot-gray { background: #8b949e; }
    .row .tech { flex: 1; }
    .row .ver { color: #8b949e; font-size: 0.85em; width: 80px; text-align: right; }
    .row .status { font-size: 0.8em; width: 90px; text-align: right; }
    .status-ok { color: #3fb950; } .status-warn { color: #d29922; } .status-eol { color: #f85149; }
    .card-footer { padding: 10px 16px; border-top: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .card-footer a { color: #58a6ff; font-size: 0.75em; text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
    .card-footer .count { color: #8b949e; font-size: 0.75em; }
    .loading { padding: 32px 16px; text-align: center; color: #8b949e; }
  </style>
</head>
<body>
  <div class="card" id="card"><div class="loading">Loading stack health...</div></div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const stack = (params.get('stack') || 'nodejs,python,postgresql,docker-engine,kubernetes').split(',').map(s => s.trim()).filter(Boolean);
      const theme = params.get('theme') || 'dark';
      const card = document.getElementById('card');

      if (theme === 'light') {
        card.style.background = '#fff';
        card.style.color = '#1f2328';
        card.style.borderColor = '#d0d7de';
      }
      const borderColor = theme === 'light' ? '#d0d7de' : '#30363d';

      Promise.allSettled(
        stack.map(p =>
          fetch(`https://endoflife.date/api/${p}.json`)
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(data => ({ product: p, data: data[0], ok: true }))
            .catch(() => ({ product: p, data: null, ok: false }))
        )
      ).then(results => {
        const items = results.map(r => r.value);
        let supported = 0, warning = 0, eol = 0, unknown = 0;

        const rows = items.map(item => {
          const name = item.product.charAt(0).toUpperCase() + item.product.slice(1).replace(/-/g, ' ');
          if (!item.ok || !item.data) {
            unknown++;
            return `<div class="row"><span class="dot dot-gray"></span><span class="tech">${name}</span><span class="ver">—</span><span class="status" style="color:#8b949e">Unknown</span></div>`;
          }
          const d = item.data;
          const ver = d.latest || d.cycle;
          const now = new Date();
          let dotCls, statusCls, statusTxt;

          if (d.eol === false) {
            supported++; dotCls = 'dot-green'; statusCls = 'status-ok'; statusTxt = 'Supported';
          } else if (d.eol === true) {
            eol++; dotCls = 'dot-red'; statusCls = 'status-eol'; statusTxt = 'EOL';
          } else {
            const eolDate = new Date(d.eol);
            if (eolDate < now) { eol++; dotCls = 'dot-red'; statusCls = 'status-eol'; statusTxt = 'EOL'; }
            else if ((eolDate - now) / 86400000 < 90) { warning++; dotCls = 'dot-yellow'; statusCls = 'status-warn'; statusTxt = 'EOL Soon'; }
            else { supported++; dotCls = 'dot-green'; statusCls = 'status-ok'; statusTxt = 'Supported'; }
          }
          return `<div class="row"><span class="dot ${dotCls}"></span><span class="tech">${name}</span><span class="ver">v${ver}</span><span class="status ${statusCls}">${statusTxt}</span></div>`;
        }).join('');

        const total = items.length;
        let grade, gradeCls;
        const eolPct = eol / total;
        if (eolPct === 0 && warning === 0) { grade = 'A'; gradeCls = 'grade-a'; }
        else if (eolPct === 0) { grade = 'B'; gradeCls = 'grade-b'; }
        else if (eolPct < 0.3) { grade = 'C'; gradeCls = 'grade-c'; }
        else if (eolPct < 0.6) { grade = 'D'; gradeCls = 'grade-d'; }
        else { grade = 'F'; gradeCls = 'grade-f'; }

        card.innerHTML = `
          <div class="card-header" style="border-color:${borderColor}">
            Stack Health
            <span class="grade ${gradeCls}">Grade ${grade}</span>
          </div>
          <div class="card-body">${rows}</div>
          <div class="card-footer" style="border-color:${borderColor}">
            <span class="count">${supported} supported · ${warning} warning · ${eol} EOL</span>
            <a href="https://releaserun.com/tools/stack-health/?utm_source=widget&utm_medium=embed&utm_campaign=stack-card" target="_blank" rel="noopener">Powered by ReleaseRun</a>
          </div>
        `;
      });
    })();
  </script>
</body>
</html>
