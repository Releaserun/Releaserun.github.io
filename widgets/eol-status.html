<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOL Status Widget — ReleaseRun</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: transparent; }
    .widget { border: 1px solid #30363d; border-radius: 8px; overflow: hidden; max-width: 360px; background: #0d1117; color: #e6edf3; }
    .widget-header { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; }
    .widget-header .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: #3fb950; }
    .dot-yellow { background: #d29922; }
    .dot-red { background: #f85149; }
    .dot-gray { background: #8b949e; }
    .widget-header .name { font-weight: 600; font-size: 0.95em; }
    .widget-header .version { color: #8b949e; font-size: 0.85em; margin-left: auto; }
    .widget-body { padding: 12px 16px; }
    .widget-body .status { font-size: 0.9em; margin-bottom: 6px; }
    .widget-body .eol-date { color: #8b949e; font-size: 0.8em; }
    .widget-footer { padding: 8px 16px; border-top: 1px solid #30363d; text-align: right; }
    .widget-footer a { color: #58a6ff; font-size: 0.75em; text-decoration: none; }
    .widget-footer a:hover { text-decoration: underline; }
    .loading { padding: 24px 16px; text-align: center; color: #8b949e; font-size: 0.9em; }
    .error { padding: 16px; color: #f85149; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="loading">Loading...</div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const product = params.get('product') || 'nodejs';
      const cycle = params.get('cycle') || '';
      const theme = params.get('theme') || 'dark';
      const w = document.getElementById('widget');

      if (theme === 'light') {
        w.style.background = '#fff';
        w.style.color = '#1f2328';
        w.style.borderColor = '#d0d7de';
        document.querySelectorAll('.widget-footer,.widget-header').forEach(el => {
          if (el.classList.contains('widget-header') || el.classList.contains('widget-footer'))
            el.style.borderColor = '#d0d7de';
        });
      }

      const apiBase = 'https://endoflife.date/api';
      let url = `${apiBase}/${product}.json`;

      fetch(url)
        .then(r => { if (!r.ok) throw new Error('Not found'); return r.json(); })
        .then(data => {
          const item = cycle ? data.find(d => d.cycle === cycle) : data[0];
          if (!item) throw new Error('Cycle not found');

          const now = new Date();
          const eolRaw = item.eol;
          let statusText, dotClass, eolText;

          if (eolRaw === false) {
            statusText = 'Actively Supported';
            dotClass = 'dot-green';
            eolText = 'No EOL date announced';
          } else if (eolRaw === true) {
            statusText = 'End of Life';
            dotClass = 'dot-red';
            eolText = 'This version has reached end of life';
          } else {
            const eolDate = new Date(eolRaw);
            if (eolDate < now) {
              statusText = 'End of Life';
              dotClass = 'dot-red';
              eolText = `Reached EOL on ${eolRaw}`;
            } else {
              const daysLeft = Math.ceil((eolDate - now) / 86400000);
              if (daysLeft < 90) {
                statusText = 'Approaching EOL';
                dotClass = 'dot-yellow';
              } else {
                statusText = 'Supported';
                dotClass = 'dot-green';
              }
              eolText = `EOL: ${eolRaw} (${daysLeft} days remaining)`;
            }
          }

          const displayName = product.charAt(0).toUpperCase() + product.slice(1);
          const latest = item.latest || item.cycle;

          w.innerHTML = `
            <div class="widget-header" style="${theme === 'light' ? 'border-color:#d0d7de' : ''}">
              <span class="dot ${dotClass}"></span>
              <span class="name">${displayName} ${item.cycle}</span>
              <span class="version">v${latest}</span>
            </div>
            <div class="widget-body">
              <div class="status">${statusText}</div>
              <div class="eol-date">${eolText}</div>
            </div>
            <div class="widget-footer" style="${theme === 'light' ? 'border-color:#d0d7de' : ''}">
              <a href="https://releaserun.com/tools/stack-health/?utm_source=widget&utm_medium=embed&utm_campaign=eol-widget" target="_blank" rel="noopener">Powered by ReleaseRun</a>
            </div>
          `;
        })
        .catch(err => {
          w.innerHTML = `<div class="error">Could not load data for "${product}"${cycle ? ` cycle ${cycle}` : ''}.<br><a href="https://releaserun.com/tools/" style="color:#58a6ff">Try ReleaseRun Tools</a></div>`;
        });
    })();
  </script>
</body>
</html>
